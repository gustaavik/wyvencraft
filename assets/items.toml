# Item definitions.
#
# There is ONE registry of things the player can hold, and an item is described
# by the CAPABILITIES it declares rather than by what kind of thing it is. Each
# `[item.<capability>]` table below adds one; gameplay asks an item for the
# capability it needs and gets nothing if the item has not got it, so an item
# may carry any combination (shears are a tool *and* shearable).
#
# A placeable item is auto-generated for every visible, non-fluid-flow block
# (same id as the block, stacks to 64, places itself). Entries here either
# OVERRIDE an auto-generated block item by id, or define new items. An override
# replaces only the capabilities it names — one that says nothing about
# placement stays placeable.
#
# IDS ARE THE SAVE FORMAT: player inventories, crafting recipes, mob drops and
# `/give` identify items by the exact `id` string.
#
# Fields:
#   id          unique key: lowercase letters, digits and underscores only, so
#               it stays typeable as a single token (`/give wooden_pickaxe 5`).
#               Anything else rejects the whole file and the game falls back to
#               its builtin copy.
#   display_name  what the player reads, in the inventory tooltip and above the
#               hotbar. Optional: the default title-cases the id, so
#               `wooden_pickaxe` already reads as "Wooden Pickaxe". Spell it out
#               only where that rule gets it wrong. A block item with no
#               `display_name` of its own inherits the block's.
#   max_stack   defaults to 64, or 1 if any capability wears out (tools, armor)
#
# Capabilities — a table nothing recognises rejects the whole file, so a typo
# is a startup error rather than a silently missing behaviour:
#   [item.placeable] using the item puts a block in the world:
#       block       id of the block it places (block items get theirs
#                   automatically, and keep it through an override)
#   [item.tool] makes the item dig, and maybe fight:
#       dig_speed   mining-speed multiplier when the tool matches (hand = 1.0)
#       durability  uses before the tool breaks
#       harvests    block materials this tool mines at full speed
#       damage      melee damage per swing; omit for a tool that hits no harder
#                   than a bare fist (pickaxes, shovels)
#   [item.consumable] makes the item edible: hunger + saturation restored
#   [item.equippable] makes the item wearable:
#       slot        which equipment slot it fits: helmet, chestplate, leggings,
#                   boots. A piece only goes in its own slot.
#       defense     defense points, summed across worn pieces
#       durability  hits taken before the piece breaks
#   [item.shearable] makes the item shear. A marker with no fields: a block
#               whose drops say { requires = "shearable" } yields its item only
#               for an item carrying this.
#
#   [item.model] draws the item as a 3D model instead of the default cube,
#                both in the holder's hand and where it lies in the world:
#       path        a .gltf, .bbmodel or Java Block/Item .json under
#                   assets/models/items/. A flat 2D item instead names a
#                   three-line `item/generated` stub, whose geometry is
#                   extruded from its sprite's alpha and which places
#                   itself, so scale/offset/rotation below are not needed.
#       scale       uniform scale (default 1.0)
#       offset      shift in the model's own space, applied before scale
#                   (Blockbench authors on a 0..1 block, so [-0.5, y, -0.5]
#                   re-centres a model on the point it is drawn at)
#       rotation    degrees about the model's own axes, applied after offset
#                   (exports disagree on which plane a flat object lies in:
#                   the tool models are flat in XY, vine_sword in YZ)
#   Models are visual only: unlike the capabilities above they never affect
#   gameplay, and never take part in the multiplayer content check.
#
# [starter_kit] lists what a fresh survival player spawns with, in hotbar
# order. Tools and armor spawn fresh (full durability); `count` applies to
# stackables.

# Tools come in three tiers. A tier is expressed purely as dig_speed +
# durability (+ damage on the shapes that fight) — there is deliberately no
# harvest-level gate, so every block stays mineable by hand and a better
# pickaxe only means a faster one:
#
#   wooden  dig_speed 2.0   durability  60
#   stone   dig_speed 4.0   durability 132
#   iron    dig_speed 6.0   durability 250
#
# Swords are the exception: they only harvest plants, so their tier gradient
# lives in `damage` and `durability` and their dig_speed stays flat.
#
# The tool models are all flat in the XY plane, so they carry
# rotation = [0, 90, 0] to sit broadside in the fist the way vine_sword does.
# Their grips sit at y ≈ 0 (vine_sword's dips to -0.889), which is why they need
# no vertical offset correction.

[[item]]
id = "wooden_pickaxe"

[item.tool]
dig_speed = 2.0
durability = 60
harvests = ["stone"]

[item.model]
path = "assets/models/items/wooden_pickaxe.json"
scale = 0.55
offset = [-0.5, 0.0, -0.5]
rotation = [0.0, 90.0, 0.0]

[[item]]
id = "wooden_axe"

[item.tool]
dig_speed = 2.0
durability = 60
harvests = ["wood"]
damage = 3.0

[item.model]
path = "assets/models/items/wooden_axe.json"
scale = 0.55
offset = [-0.5, 0.0, -0.5]
rotation = [0.0, 90.0, 0.0]

[[item]]
id = "wooden_shovel"

[item.tool]
dig_speed = 2.0
durability = 60
harvests = ["dirt", "sand"]

[item.model]
path = "assets/models/items/wooden_shovel.json"
scale = 0.5
offset = [-0.5, 0.0, -0.5]
rotation = [0.0, 90.0, 0.0]

[[item]]
id = "shears"

[item.tool]
dig_speed = 5.0
durability = 120
harvests = ["plant"]

# The only item that shears. Oak leaves ask for this capability by name
# (`drops = { requires = "shearable" }` in blocks.toml), so a second pair of
# shears gates them by declaring it rather than by being called "shears".
[item.shearable]

[[item]]
