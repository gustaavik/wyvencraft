# Item definitions.
#
# A placeable item is auto-generated for every visible, non-fluid-flow block
# (same name as the block, stacks to 64, places itself). Entries here either
# OVERRIDE an auto-generated block item by name, or define new items.
#
# NAMES ARE THE SAVE FORMAT: player inventories and crafting recipes identify
# items by the exact `name` string.
#
# Fields:
#   name        unique display/save name
#   max_stack   defaults to 64, or 1 for tools
#   place_block name of the block this item places (block items get theirs
#               automatically)
#   [item.tool] makes the item a tool:
#       kind        free-form tool kind; blocks whose drops say
#                   { requires_tool = "<kind>" } only drop for this kind
#       dig_speed   mining-speed multiplier when the tool matches (hand = 1.0)
#       durability  uses before the tool breaks
#       harvests    block materials this tool mines at full speed
#   [item.food] makes the item edible: hunger + saturation restored
#   [item.armor] makes the item wearable:
#       slot        which equipment slot it fits: helmet, chestplate, leggings,
#                   boots, glove, cape. A piece only goes in its own slot.
#       defense     defense points, summed across worn pieces
#       durability  hits taken before the piece breaks
#
# [starter_kit] lists what a fresh survival player spawns with, in hotbar
# order. Tools and armor spawn fresh (full durability); `count` applies to
# stackables.

[[item]]
name = "wooden pickaxe"

[item.tool]
kind = "pickaxe"
dig_speed = 2.0
durability = 60
harvests = ["stone"]

[[item]]
name = "wooden axe"

[item.tool]
kind = "axe"
dig_speed = 2.0
durability = 60
harvests = ["wood"]

[[item]]
name = "wooden shovel"

[item.tool]
kind = "shovel"
dig_speed = 2.0
durability = 60
harvests = ["dirt", "sand"]

[[item]]
name = "shears"

[item.tool]
kind = "shears"
dig_speed = 5.0
durability = 120
harvests = ["plant"]

[[item]]
name = "apple"

[item.food]
hunger = 4.0
saturation = 2.4

[[item]]
name = "bread"

[item.food]
hunger = 5.0
saturation = 6.0

# Armor. Worn pieces live in the six equipment slots; their `defense` sums into
# the damage reduction applied by `Player::damage`, and every hit wears each worn
# piece by one point. A piece only fits the slot it names.

[[item]]
name = "helmet"

[item.armor]
slot = "helmet"
defense = 2.0
durability = 120

[[item]]
name = "chestplate"

[item.armor]
slot = "chestplate"
defense = 6.0
durability = 240

[[item]]
name = "leggings"

[item.armor]
slot = "leggings"
defense = 5.0
durability = 200

[[item]]
name = "boots"

[item.armor]
slot = "boots"
defense = 2.0
durability = 120

[[item]]
name = "glove"

[item.armor]
slot = "glove"
defense = 1.0
durability = 80

[[item]]
name = "cape"

[item.armor]
slot = "cape"
defense = 1.0
durability = 80

[starter_kit]
survival = [
    { item = "wooden pickaxe" },
    { item = "wooden axe" },
    { item = "wooden shovel" },
    { item = "apple", count = 5 },
    { item = "bread", count = 3 },
]
