[item.model]
path = "assets/models/blocks/mushroom1.bbmodel"
scale = 0.5
offset = [-0.5, 0.0, -0.5]

[[item]]
id = "brown_mushroom"

[item.model]
path = "assets/models/blocks/mushroom2.bbmodel"
scale = 0.5
offset = [-0.55, 0.03, -0.65]

