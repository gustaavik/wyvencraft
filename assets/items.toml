[[item]]
id = "feather"

[[item]]
id = "string"

[[item]]
id = "arrow"

[[item]]
id = "coal"

[[item]]
id = "clay_ball"

[[item]]
id = "flint"

[[item]]
id = "copper_ingot"

# Armor. Worn pieces live in the six equipment slots; their `defense` sums into
# the damage reduction applied by `Player::damage`, and every hit wears each worn
# piece by one point. A piece only fits the slot it names.
#
# The four plate pieces are the copper tier and are named for it, so a second
# tier can be added beside them rather than replacing them. `glove` and `cape`
# are tierless and keep their bare ids.

[[item]]
id = "copper_helmet"

[item.armor]
slot = "helmet"
defense = 2.0
durability = 120

[[item]]
id = "copper_chestplate"

[item.armor]
slot = "chestplate"
defense = 6.0
durability = 240

[[item]]
id = "copper_leggings"

[item.armor]
slot = "leggings"
defense = 5.0
durability = 200

[[item]]
id = "copper_boots"

[item.armor]
slot = "boots"
defense = 2.0
durability = 120

[[item]]
id = "glove"

[item.armor]
slot = "glove"
defense = 1.0
durability = 80

[[item]]
id = "cape"

[item.armor]
slot = "cape"
defense = 1.0
durability = 80

# Crafting intermediate: the handle every tool is built around. No components,
# so it is a plain stackable drawing its icon from `assets/textures/stick.png`.

[[item]]
id = "stick"

# Ground cover. These four override the items auto-generated for the matching
# [block.model] blocks, adding nothing but the model — which is enough to give
# each one a 3D inventory icon, a model in the hand, and a model where it lies
# on the ground. Naming the same file as the block costs nothing: the model
# registry memoises by path, so both share one parse and one GPU texture.
# `place_block` is inherited from the auto-generated item and must not be
# repeated here.

[[item]]
id = "blue_bells"

[item.model]
path = "assets/models/plant1.bbmodel"
scale = 0.4
offset = [-0.5, 0.0, -0.5]

[[item]]
id = "red_flower"

[item.model]
path = "assets/models/plant2.bbmodel"
scale = 0.4
offset = [-0.5, 0.0, -0.5]

[[item]]
id = "red_mushroom"

[item.model]
path = "assets/models/mushroom1.bbmodel"
scale = 0.5
offset = [-0.5, 0.0, -0.5]

[[item]]
id = "brown_mushroom"

[item.model]
path = "assets/models/mushroom2.bbmodel"
scale = 0.45
offset = [-0.5, 0.0, -0.5]

[starter_kit]
survival = [
    { item = "wooden_pickaxe" },
    { item = "wooden_axe" },
    { item = "wooden_shovel" },
    { item = "vine_sword" },
    { item = "apple", count = 5 },
    { item = "bread", count = 3 },
]
