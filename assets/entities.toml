# Entity kind definitions: the tuning for every simulated entity type.
#
# The engine requires a "player" kind (with movement + vitals) and a
# "dropped item" kind (with item params); future entity types are added as
# new [[entity]] entries with the components they need. Numbers here are
# read at startup — edit and restart to tune.
#
# Components:
#   [entity.physics]   gravity, terminal_velocity, collision width/height,
#                      ground_friction (exponential damping/s while grounded)
#   [entity.movement]  walk/sprint/fly/jump speeds, eye_height, reach,
#                      air_control (airborne steering rate/s) and
#                      min_jump_height (floor for the variable-height jump)
#   [entity.vitals]    health/hunger model (see field names)
#   [entity.item]      dropped-item behavior: despawn timer, pop/throw
#                      speeds, pickup grace delays, pickup range
#   [entity.mob]       makes the kind a mob: max_health, walk/run/jump
#                      speeds, drops = [{ item, min, max }] death loot;
#                      hostile = true adds aggro_range, attack_range,
#                      attack_damage, attack_cooldown; [entity.mob.ranged]
#                      (projectile_speed/damage, keep_distance) makes the
#                      attack a projectile instead of melee.
#                      Spawn rules live in spawning.toml, not here.
#   [entity.visual]    kind = "humanoid" (skinned box model; optional
#                      skin = "<mob skin>", arms_forward = true),
#                      kind = "quadruped" (skin + body/head/leg px sizes),
#                      or kind = "item_cube" (spinning, bobbing cube)

[[entity]]
name = "player"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.6
height = 1.8

[entity.movement]
walk_speed = 4.3
sprint_speed = 6.5
fly_speed = 12.0
jump_speed = 9.0
eye_height = 1.62
reach = 5.0
air_control = 6.0
min_jump_height = 1.2

[entity.vitals]
max_health = 20.0
max_hunger = 20.0
safe_fall = 3.0
fall_damage_per_block = 1.0
hunger_drain_base = 0.05
hunger_drain_sprint = 0.15
regen_hunger_threshold = 18.0
regen_rate = 1.0
starve_rate = 1.0

[entity.visual]
kind = "humanoid"

[[entity]]
name = "dropped item"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.25
height = 0.25
ground_friction = 10.0

[entity.item]
despawn_seconds = 300.0
pop_horizontal = 1.4
pop_vertical = 3.2
throw_speed = 6.0
throw_lift = 2.0
block_drop_delay = 0.3
thrown_delay = 1.5
pickup_range = 1.0

[entity.visual]
kind = "item_cube"
spin_rate = 1.8
bob_amplitude = 0.03
bob_rate = 2.4

[[entity]]
name = "cow"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.9
height = 1.4
ground_friction = 10.0

[entity.mob]
max_health = 10.0
walk_speed = 1.4
run_speed = 3.0
jump_speed = 9.0
drops = [{ item = "raw beef", min = 1, max = 3 }]

[entity.visual]
kind = "quadruped"
skin = "cow"
body = [12.0, 10.0, 18.0]
head = [8.0, 8.0, 6.0]
leg = [4.0, 11.0, 4.0]

[[entity]]
