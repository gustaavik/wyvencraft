# Entity kind definitions: the tuning for every simulated entity type.
#
# The engine requires a "player" kind (with movement + vitals) and a
# "dropped item" kind (with item params); future entity types are added as
# new [[entity]] entries with the components they need. Numbers here are
# read at startup — edit and restart to tune.
#
# Components:
#   [entity.physics]   gravity, terminal_velocity, collision width/height,
#                      ground_friction (exponential damping/s while grounded)
#   [entity.movement]  walk/sprint/fly/jump speeds, eye_height, reach,
#                      air_control (airborne steering rate/s) and
#                      min_jump_height (floor for the variable-height jump)
#   [entity.vitals]    health/hunger model (see field names)
#   [entity.item]      dropped-item behavior: despawn timer, pop/throw
#                      speeds, pickup grace delays, pickup range
#   [entity.mob]       makes the kind a mob: max_health, walk/run/jump
#                      speeds, drops = [{ item, min, max }] death loot.
#                      behavior = "passive" (default: wanders, flees when
#                      hurt) | "hostile" (chases and attacks; adds
#                      aggro_range, attack_range, attack_damage,
#                      attack_cooldown) | "inert" (a fixture: never wanders,
#                      turns, or reacts — just physics and a collision box).
#                      knockback_resistance = 0.0..1.0 is separate from that:
#                      0 (default) takes a full shove when hit, 1 cannot be
#                      moved by one, in between is "heavy".
#                      [entity.mob.ranged] (projectile_speed/damage,
#                      keep_distance) makes the attack a projectile instead
#                      of melee. Spawn rules live in spawning.toml.
#   [entity.visual]    kind = "humanoid" (skinned box model; optional
#                      skin = "<mob skin>", arms_forward = true),
#                      kind = "quadruped" (skin + body/head/leg px sizes, plus
#                      head_uv/body_uv/leg_uv — where each part's unwrap starts
#                      on the sheet, Minecraft's texOffs. Defaults (0,0)/(28,8)/
#                      (0,16) are the layout most quadrupeds share; the cow
#                      names its own body_uv. Sizes are the box as it STANDS:
#                      the body's unwrap is drawn upright and tipped over, which
#                      the model does for you),
#                      kind = "item_cube" (spinning, bobbing drop; `scale`
#                      draws it larger than its collision box),
#                      or kind = "model" (geometry from a .gltf/.bbmodel file:
#                      path = "assets/models/items/<name>.bbmodel", optional scale and
#                      offset — the offset applies in the model's own space)

[[entity]]
name = "player"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.6
height = 1.8

[entity.movement]
walk_speed = 4.3
sprint_speed = 6.5
fly_speed = 12.0
jump_speed = 9.0
eye_height = 1.62
reach = 5.0
air_control = 6.0
min_jump_height = 1.2

[entity.vitals]
max_health = 20.0
max_hunger = 20.0
safe_fall = 3.0
fall_damage_per_block = 1.0
hunger_drain_base = 0.05
hunger_drain_sprint = 0.15
regen_hunger_threshold = 18.0
regen_rate = 1.0
starve_rate = 1.0

[entity.visual]
kind = "humanoid"

[[entity]]
name = "dropped item"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.25
height = 0.25
ground_friction = 10.0

[entity.item]
despawn_seconds = 300.0
pop_horizontal = 1.4
pop_vertical = 3.2
throw_speed = 6.0
throw_lift = 2.0
block_drop_delay = 0.3
thrown_delay = 1.5
pickup_range = 1.0

[entity.visual]
kind = "item_cube"
spin_rate = 1.8
bob_amplitude = 0.03
bob_rate = 2.4
# Drawn twice its collision box, so a drop reads from across the room without
# becoming a bigger obstacle. Raise this alone to make drops larger.
scale = 2.0

[[entity]]
name = "cow"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.9
height = 1.4
ground_friction = 10.0

[entity.mob]
max_health = 10.0
walk_speed = 1.4
run_speed = 3.0
jump_speed = 9.0
drops = [
    { item = "raw_beef", min = 1, max = 3 },
    { item = "leather", min = 1, max = 2 },
]

[entity.visual]
kind = "quadruped"
skin = "cow"
body = [12.0, 10.0, 18.0]
head = [8.0, 8.0, 6.0]
leg = [4.0, 12.0, 4.0]
# The cow is the one quadruped whose body is not unwrapped at (28, 8).
body_uv = [18, 4]

[[entity]]
name = "sheep"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.9
height = 1.2
ground_friction = 10.0

[entity.mob]
max_health = 8.0
walk_speed = 1.3
run_speed = 2.8
jump_speed = 9.0
drops = [
    { item = "mutton", min = 1, max = 2 },
    { item = "string", min = 1, max = 3 },
]

[entity.visual]
kind = "quadruped"
skin = "sheep"
body = [8.0, 6.0, 16.0]
head = [6.0, 6.0, 8.0]
leg = [4.0, 12.0, 4.0]

[[entity]]
name = "pig"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.9
height = 0.9
ground_friction = 10.0

[entity.mob]
max_health = 10.0
walk_speed = 1.3
run_speed = 2.8
jump_speed = 9.0
behavior = "passive"
drops = [{ item = "raw_porkchop", min = 1, max = 3 }]

[entity.visual]
kind = "quadruped"
skin = "pig"
body = [10.0, 8.0, 16.0]
head = [8.0, 8.0, 8.0]
leg = [4.0, 6.0, 4.0]

# Small, skittish, and the source of feathers. It reuses the quadruped unwrap
# (the only skinned non-humanoid shape there is) with bird-sized boxes.
[[entity]]
name = "chicken"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.5
height = 0.8
ground_friction = 10.0

[entity.mob]
max_health = 4.0
walk_speed = 1.2
run_speed = 3.4
jump_speed = 9.0
behavior = "passive"
drops = [
    { item = "raw_chicken", min = 1, max = 1 },
    { item = "feather", min = 0, max = 2 },
]

[entity.visual]
kind = "quadruped"
skin = "chicken"
body = [6.0, 6.0, 8.0]
head = [5.0, 5.0, 4.0]
leg = [2.0, 5.0, 2.0]

[[entity]]
name = "zombie"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.6
height = 1.8
ground_friction = 10.0

[entity.mob]
max_health = 20.0
walk_speed = 1.0
run_speed = 3.4
jump_speed = 9.0
behavior = "hostile"
aggro_range = 16.0
attack_range = 1.6
attack_damage = 3.0
attack_cooldown = 1.0

[entity.visual]
kind = "humanoid"
skin = "zombie"
arms_forward = true

[[entity]]
name = "skeleton"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.6
height = 1.8
ground_friction = 10.0

[entity.mob]
max_health = 16.0
walk_speed = 1.0
run_speed = 3.2
jump_speed = 9.0
behavior = "hostile"
aggro_range = 18.0
attack_range = 12.0
attack_cooldown = 1.6

drops = [{ item = "arrow", min = 0, max = 2 }]

[entity.mob.ranged]
projectile_speed = 18.0
projectile_damage = 3.0
keep_distance = 8.0

[entity.visual]
kind = "humanoid"
skin = "skeleton"

# A stationary prop drawn from a model file rather than from box parts. It has
# no entry in spawning.toml, so it never appears on its own — spawn it with
# `WYVEN_DEBUG_SPAWN="vine sword"` to see the model loader's output in-world.
[[entity]]
name = "vine sword"

[entity.physics]
gravity = 28.0
terminal_velocity = -60.0
width = 0.6
height = 2.4
ground_friction = 10.0

[entity.mob]
max_health = 20.0
walk_speed = 0.0
run_speed = 0.0
jump_speed = 0.0
# A fixture, not a creature: no wandering, no turning, no reaction to being hit.
behavior = "inert"
# ...and bolted down. Drop this line (or lower it) and the prop still never
# acts, but a hit sends it tumbling — the two axes are independent.
knockback_resistance = 1.0

[entity.visual]
kind = "model"
# Either export of this object works and renders identically — swap the
# extension to .gltf to exercise the other loader.
path = "assets/models/items/vine_sword.bbmodel"
# Blockbench authors on a 0..1 block; re-centre it horizontally and lift the
# hilt (which dips to y = -0.889) up to the entity's feet.
offset = [-0.5, 0.889, -0.5]
