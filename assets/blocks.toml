# Ground cover: model-backed, walk-through decoration scattered on the surface
# by worldgen (see the per-biome `plants` lists in worldgen.toml). No `textures`
# — the models carry their own — and no `drops`, so each yields its own item.
# `hardness = 0.0` still costs one mining tick (break_seconds floors at 0.05 s).

[[block]]
id = "blue_bells"
render = "cutout"
solid = false
hardness = 0.0
material = "plant"
random_yaw = true

[block.model]
path = "assets/models/plant1.bbmodel"
offset = [-0.5, 0.0, -0.5]

[[block]]
id = "red_flower"
render = "cutout"
solid = false
hardness = 0.0
material = "plant"
random_yaw = true

[block.model]
path = "assets/models/plant2.bbmodel"
offset = [-0.5, 0.0, -0.5]

[[block]]
id = "red_mushroom"
render = "cutout"
solid = false
hardness = 0.0
material = "plant"
random_yaw = true

[block.model]
path = "assets/models/mushroom1.bbmodel"
offset = [-0.5, 0.0, -0.5]

[[block]]
id = "brown_mushroom"
render = "cutout"
solid = false
hardness = 0.0
material = "plant"
random_yaw = true

[block.model]
path = "assets/models/mushroom2.bbmodel"
offset = [-0.5, 0.0, -0.5]

# Authored in Blockbench as two crossed planes, so it needs no `[block.model]`
# placement: the model is already in cell coordinates.
[[block]]
