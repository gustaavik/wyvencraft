# Block definitions.
#
# Every block in the game is declared here; the engine registers them in file
# order. "air" is built in (always id 0) and may not be declared.
#
# IDS ARE THE SAVE FORMAT. Save files, multiplayer, worldgen, recipes and drops
# all identify blocks by the exact `id` string, so renaming a block orphans it
# in existing worlds. Reordering entries is safe for saves (they resolve by id)
# but changes the numeric ids used within a single session.
#
# Fields:
#   id        unique key: lowercase letters, digits and underscores only, so it
#             stays typeable as a single token (`/give oak_log 5`) and needs no
#             quoting when another file refers to it. Anything else rejects the
#             whole file and the game falls back to its builtin copy.
#   display_name  what the player reads, in the inventory tooltip and above the
#             hotbar. Optional: the default title-cases the id, so `oak_log`
#             already reads as "Oak Log". Spell it out only where that rule
#             gets it wrong.
#   render    opaque | transparent | cutout | invisible
#   solid     whether entities collide with it
#   hardness  relative mining time; `inf` = unbreakable
#   material  stone | dirt | sand | wood | plant | glass | other
#             (matched against a tool's `harvests` list for mining speed)
#   textures  one texture name for all faces, or
#             { top = "...", bottom = "...", side = "..." }, or the fully
#             explicit { neg_x, pos_x, neg_y, pos_y, neg_z, pos_z }.
#             Optional for a block whose geometry brings its own texture and
#             never samples the atlas — a `block_model`, a [block.model] or a
#             [block.fluid.texture].
#   block_model  the block is authored in Blockbench and exported as a Java
#             Block/Item .json under assets/blocks/, with its textures as
#             separate 256x256 PNGs in assets/textures/. This is how blocks
#             are made from now on; `textures` and [block.model] are the older
#             paths, kept working while the remaining blocks are re-authored.
#             The model is already in cell coordinates (a full cube is
#             from [0,0,0] to [16,16,16]), so it takes no placement. Set
#             `cullface` on every outward face or the block will draw all six
#             faces even when buried, and `tintindex` only on faces that
#             should take the biome colour (`tint` in assets/worldgen.toml).
#   drops     what breaking the block yields (default: the block's own item)
#             "self" | "none" | { requires_tool = "<tool kind>" }
#             | { item = "<item id>", count = N }
#   [block.fluid] with `flow_levels = N` marks the block as a fluid source;
#             the engine auto-registers "<id>_flow_1".."<id>_flow_N"
#             blocks after all declared blocks, and the fluid simulation
#             spreads/recedes between them.
#   [block.fluid.texture] draws the fluid from an animation strip instead of
#             an atlas tile: `frames` square frames stacked top to bottom, in
#             as many columns as the image's width allows. COLUMN 0 IS FLOWING,
#             COLUMN 1 IS STILL (one column serves both). A source block reads
#             the still column on every face; a flowing block reads it on top
#             and bottom and the flowing column on its sides. `fps` defaults to
#             8, and `fps * 3600` must be a whole multiple of `frames` or the
#             shader's hourly time wrap jumps (the loader rejects one that is
#             not). `tint` is a `tintindex` into the biome colours in
#             assets/worldgen.toml (2 = water); omit it for art that carries
#             its own colour. `opacity` (0..1) sets how much of the riverbed
#             shows through, rescaling the art's alpha — a body of fluid is a
#             SINGLE blended sheet (its interior faces are culled), so depth
#             adds no opacity and this number is the whole of it. Frames may be
#             any square size that divides 256, like a `block_model` texture.
#   [block.model] draws the block as a .gltf/.bbmodel from assets/models/
#             instead of six atlas-textured cube faces — the same
#             `path`/`scale`/`offset`/`rotation` spelling as [item.model] and
#             [entity.visual] kind = "model". The model is baked into the
#             block's own cell, so a Blockbench author working on the 0..16
#             grid wants `offset = [-0.5, 0, -0.5]` to re-centre it. Model
#             blocks emit no cube faces at all, and (like item models) are
#             visual-only: they never affect gameplay and never take part in
#             the multiplayer content check.
#   random_yaw  turn each instance by a hash of its position, so a field of
#             plants doesn't read as a grid of clones. Only meaningful
#             alongside [block.model].

[[block]]
id = "stone"
render = "opaque"
solid = true
hardness = 1.5
material = "stone"
block_model = "assets/blocks/stone_block.json"
drops = { item = "cobblestone" }

[[block]]
id = "dirt"
render = "opaque"
solid = true
hardness = 0.5
material = "dirt"
block_model = "assets/blocks/dirt_block.json"

[[block]]
id = "grass"
render = "opaque"
solid = true
hardness = 0.6
material = "dirt"
block_model = "assets/blocks/grass_block.json"

[[block]]
id = "sand"
render = "opaque"
solid = true
hardness = 0.5
material = "sand"
block_model = "assets/blocks/sand_block.json"

[[block]]
id = "water"
render = "transparent"
solid = false
hardness = inf
material = "other"

[block.fluid]
flow_levels = 7

# 64 frames of 16px in two columns: flowing on the left, still on the right.
# The art is greyscale so `tint` gives every biome its own water colour, and
# its alpha is a placeholder `opacity` overrides — see the schema above.
[block.fluid.texture]
path = "assets/textures/water_flow.png"
frames = 64
fps = 8
tint = 2
opacity = 0.85

