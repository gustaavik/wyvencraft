# Wyvencraft crafting recipes.
#
# Every [[recipe]] entry defines one shapeless recipe:
#
#   output      - name of the crafted item (must match an in-game item name)
#   count       - how many the craft produces (optional, default 1)
#   ingredients - table of item name -> count, consumed from the inventory
#
# Item names containing spaces must be quoted when used as ingredient keys,
# e.g.  ingredients = { "coal ore" = 2, wood = 1 }
#
# Recipes naming an unknown item are skipped with a warning in the log; if the
# whole file fails to parse, the game falls back to the recipes compiled into
# the binary. Edit this file and restart the game to change the recipes.
#
# In multiplayer the HOST's recipes are authoritative: they are sent to every
# client on join, and a client's own copy of this file is ignored.

[[recipe]]
output = "wooden pickaxe"
ingredients = { wood = 3 }

[[recipe]]
output = "wooden axe"
ingredients = { wood = 3 }

[[recipe]]
output = "wooden shovel"
ingredients = { wood = 2 }

# Shears: the only way to harvest leaf blocks.
[[recipe]]
output = "shears"
ingredients = { stone = 2, wood = 1 }

# Stand-in for smelting until furnaces exist.
[[recipe]]
output = "glass"
ingredients = { sand = 1 }

# Stand-in for farming until wheat exists.
[[recipe]]
output = "bread"
ingredients = { apple = 2 }

# Compact loose gravel back into stone.
[[recipe]]
output = "stone"
ingredients = { gravel = 4 }

# Armor. The plate pieces are beaten straight from ore — another stand-in for
# smelting. Glove and cape are woven from leaves until a proper cloth exists.
[[recipe]]
output = "helmet"
ingredients = { "iron ore" = 5 }

[[recipe]]
output = "chestplate"
ingredients = { "iron ore" = 8 }

[[recipe]]
output = "leggings"
ingredients = { "iron ore" = 7 }

[[recipe]]
output = "boots"
ingredients = { "iron ore" = 4 }

[[recipe]]
output = "glove"
ingredients = { leaves = 4 }

[[recipe]]
output = "cape"
ingredients = { leaves = 6 }
