name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload to"
        required: true

# `gh release upload` writes to the release.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # `.cargo/config.toml` is gitignored, so its `[net]` block never reaches CI.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Baked into the binary by `option_env!` in `auth::DEFAULT_AUTH_URL` — this is
  # what a downloaded release talks to. No trailing slash.
  WYVEN_AUTH_URL: https://auth.wyvencraft.com

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # One broken target still ships the others.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            # macos-13 has been retired; this is the current standard Intel runner.
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    steps:
      - name: Resolve the release tag
        run: echo "TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # `wcauth-ticket` is a git dependency on the private gustaavik/wcauthserver
      # repo, which the built-in GITHUB_TOKEN cannot read.
      - name: Authenticate to the private wcauthserver repo
        env:
          WCAUTH_TOKEN: ${{ secrets.WCAUTH_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${WCAUTH_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # shaderc compiles the GLSL to SPIR-V at build time via the `vulkano-shaders`
      # proc macro. It is never linked into the shipped binary, and no Vulkan SDK
      # is needed to build: vulkano and winit load Vulkan/X11/Wayland dynamically.
      - name: Install shaderc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install shaderc
          echo "SHADERC_LIB_DIR=$(brew --prefix shaderc)/lib" >> "$GITHUB_ENV"

      # On Linux there is no usable system shaderc: Ubuntu's
      # libshaderc_combined.a is not actually combined (Debian unbundles
      # glslang), which leaves the proc macro with undefined glslang symbols and
      # makes rustc report `E0463: can't find crate for vulkano_shaders`. With no
      # system library present, shaderc-sys builds its vendored sources instead
      # and produces a self-contained archive. Do not install libshaderc-dev here.
      - name: Install the shaderc build toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      # No argument: installs the toolchain named by rust-toolchain.toml. The
      # target is added to that same pinned toolchain.
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary alone is not runnable: textures, models and the content TOMLs
      # are read from a CWD-relative `assets/` at runtime. Only the shaders are
      # compiled in.
      - name: Package
        env:
          # The Vulkan driver, mirrored by wc-launcher's moltenvk.yml: the
          # universal dylib and its licence, about 3 MB. Bundling it is what
          # lets a macOS player run a downloaded build without installing
          # Homebrew first. The launcher looks here before anywhere else, and
          # installs its own copy only if this is missing.
          MOLTENVK_URL: https://github.com/gustaavik/wc-launcher/releases/download/deps%2Fmoltenvk-1.4.2/moltenvk-1.4.2-macos-universal.tar.gz
          MOLTENVK_SHA256: bf3fa76db4d01efede0f3d08d3f9e43497316d968d6b2c672c1df42c5fbe002f
        run: |
          NAME="wyvencraft-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/wyvencraft" "dist/${NAME}/"
          cp -R assets "dist/${NAME}/"
          cp README.md "dist/${NAME}/"

          # A distributed binary carries its dependencies in compiled form, and
          # MIT/BSD require their notices to travel with it (Apache-2.0 s4 the
          # NOTICE file). THIRD-PARTY.txt is generated by `make licenses` and
          # committed; failing here is better than shipping without it.
          test -s THIRD-PARTY.txt
          cp LICENSE-MIT LICENSE-APACHE TRADEMARK.md THIRD-PARTY.txt "dist/${NAME}/"

          # macOS only: on Windows and Linux the Vulkan loader ships with the
          # GPU driver, so there is nothing to bundle.
          if [ "$RUNNER_OS" = "macOS" ]; then
            curl -fL --retry 3 -o moltenvk.tar.gz "$MOLTENVK_URL"
            echo "${MOLTENVK_SHA256}  moltenvk.tar.gz" | shasum -a 256 -c -
            mkdir -p "dist/${NAME}/MoltenVK"
            tar -xzf moltenvk.tar.gz --strip-components=1 -C "dist/${NAME}/MoltenVK"
            # The ICD manifest is written here rather than mirrored, so that
            # library_path is always relative to the dylib beside it. A loader
            # that cannot resolve it finds no driver at all.
            printf '%s\n' '{"file_format_version":"1.0.0","ICD":{"library_path":"./libMoltenVK.dylib","api_version":"1.4.0","is_portability_driver":true}}' \
              > "dist/${NAME}/MoltenVK/MoltenVK_icd.json"
            test -s "dist/${NAME}/MoltenVK/libMoltenVK.dylib"
          fi

          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          # Recorded from inside dist/, so the file names a bare filename and a
          # downloader can `shasum -c` it next to the tarball.
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
          echo "ASSET=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "NAME=${NAME}" >> "$GITHUB_ENV"

      # Also kept as a workflow artifact, so a workflow_dispatch run is useful on
      # its own and a failed upload leaves the build recoverable.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # Publishing is a job of its own rather than a step in each matrix leg: the
  # credentials live in one place, `index.json` is written exactly once per run,
  # and this runs on Ubuntu, where the AWS CLI is preinstalled.
  #
  # `!cancelled()` rather than `success()`, to match `fail-fast: false` above —
  # one target failing to build must still publish the ones that did, which is
  # the same tolerance the release page has always had.
  publish:
    name: Publish to s3.wyvencraft.com
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.WC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.WC_S3_SECRET_ACCESS_KEY }}
      # SeaweedFS ignores the region; the CLI refuses to sign without one.
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: https://s3.wyvencraft.com
      # aws-cli v2 sends x-amz-checksum-* headers by default, which several
      # S3-compatible gateways reject outright. Ask for them only where the API
      # requires them. If uploads ever start failing with SignatureDoesNotMatch,
      # this is the first thing to check and a Cloudflare header-rewriting rule
      # is the second.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BUCKET: releases
      PREFIX: game
      # What the launcher reads. Kept here so the two halves of the contract are
      # visible in one file; internal/catalog holds the other half.
      PUBLIC_URL: https://s3.wyvencraft.com/releases/game

    steps:
      - name: Resolve the release tag
        run: echo "TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      # Whatever the matrix produced. merge-multiple flattens the per-target
      # artifacts into one directory, and a target that failed simply is not
      # there — which is what makes a partial matrix a partial publish rather
      # than a failed one.
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Collect the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Through gh for both triggers rather than reading
          # github.event.release.body: workflow_dispatch has no event body, and
          # one code path means re-running after editing the notes republishes
          # the corrected text.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,publishedAt,isPrerelease > meta.json

      - name: Describe this release
        run: |
          set -euo pipefail
          # A target that failed to build leaves no archive, and there is no
          # .zip target at all today, so an unmatched glob must vanish rather
          # than survive as a literal.
          shopt -s nullglob
          # Built from the files that actually arrived, so release.json can
          # never advertise an archive that was not published. The checksum is
          # read from the sibling the build job wrote, rather than recomputed,
          # so a corrupted transfer through the artifact store is caught here.
          assets=$(
            for archive in dist/*.tar.gz dist/*.zip; do
              name=$(basename "$archive")
              sha=$(cut -d' ' -f1 < "${archive}.sha256")
              jq -n --arg name "$name" \
                    --arg path "${PREFIX}/${TAG}/${name}" \
                    --argjson size "$(stat -c%s "$archive")" \
                    --arg sha256 "$sha" \
                    '{name: $name, path: $path, size: $size, sha256: $sha256}'
            done | jq -s '.'
          )
          test "$(jq 'length' <<<"$assets")" -gt 0 || {
            echo "::error::no archives to publish for $TAG"; exit 1; }

          jq -n --slurpfile meta meta.json \
                --rawfile notes notes.md \
                --argjson assets "$assets" \
                '{tag: $meta[0].tagName,
                  name: ($meta[0].name // $meta[0].tagName),
                  publishedAt: $meta[0].publishedAt,
                  prerelease: $meta[0].isPrerelease,
                  notes: $notes,
                  assets: $assets}' > release.json
          jq -e '.tag != null and (.assets | length) > 0' release.json > /dev/null

      - name: Upload the build
        run: |
          set -euo pipefail
          shopt -s nullglob
          KEY="s3://${BUCKET}/${PREFIX}/${TAG}"
          # Immutable: a tag's bytes never change, so an edge that caches them
          # forever is exactly what we want. aws s3 cp switches to multipart
          # above 8 MB, which also keeps every request under Cloudflare's 100 MB
          # proxied-body cap — do not "optimise" that by raising the threshold.
          for archive in dist/*.tar.gz dist/*.zip; do
            case "$archive" in *.zip) type=application/zip;; *) type=application/gzip;; esac
            aws s3 cp "$archive" "${KEY}/$(basename "$archive")" \
              --content-type "$type" \
              --cache-control "public, max-age=31536000, immutable"
            aws s3 cp "${archive}.sha256" "${KEY}/$(basename "$archive").sha256" \
              --content-type "text/plain; charset=utf-8" \
              --cache-control "public, max-age=31536000, immutable"
          done

          aws s3 cp notes.md "${KEY}/notes.md" \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "public, max-age=300"
          aws s3 cp release.json "${KEY}/release.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=300"

      - name: Rebuild the catalogue
        run: |
          set -euo pipefail
          # Rebuilt from the bucket rather than from the GitHub releases list.
          # Listing is denied to anonymous readers but not to this identity, so
          # the index describes what is actually downloadable — a release page
          # entry whose objects were never uploaded would be a lie the launcher
          # has no way to detect. It also makes the step idempotent: re-running
          # for any tag reconstructs the whole index.
          tags=$(aws s3api list-objects-v2 --bucket "$BUCKET" \
                   --prefix "${PREFIX}/" --delimiter / \
                   --query 'CommonPrefixes[].Prefix' --output text)

          mkdir -p catalogue
          for prefix in $tags; do
            tag=$(basename "$prefix")
            aws s3 cp "s3://${BUCKET}/${prefix}release.json" "catalogue/${tag}.json" \
              --quiet || echo "::warning::${tag} has no release.json; skipping"
          done

          # Newest first, which is the order every consumer wants: the picker
          # lists recent builds first and Latest takes the first non-prerelease.
          jq -s --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{schemaVersion: 1,
              generatedAt: $generated,
              releases: (sort_by(.publishedAt) | reverse)}' \
            catalogue/*.json > index.json
          jq -e '.releases | length > 0' index.json > /dev/null

          # Last, and with a short TTL. Publishing the index before its objects
          # would advertise a download that 404s; a long TTL would hide a
          # release behind the edge for as long as it held it.
          aws s3 cp index.json "s3://${BUCKET}/${PREFIX}/index.json" \
            --content-type "application/json" \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Verify from the public URL
        run: |
          set -euo pipefail
          # Through the CDN and unauthenticated, exactly as a launcher sees it.
          # A publish the public URL cannot confirm is a failed publish.
          curl -fsS "${PUBLIC_URL}/index.json" \
            | jq -e --arg t "$TAG" '.releases[] | select(.tag == $t) | .assets | length > 0' > /dev/null
          curl -fsS -o /dev/null "${PUBLIC_URL}/${TAG}/notes.md"
          # Listing must stay closed: it would expose every object key,
          # including any build staged but not yet announced.
          test "$(curl -s -o /dev/null -w '%{http_code}' \
                    "https://s3.wyvencraft.com/${BUCKET}?list-type=2")" = "403"
